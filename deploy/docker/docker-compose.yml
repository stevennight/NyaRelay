services:
  controller:
    image: "${NYARELAY_IMAGE:?set in deploy/docker/.env}:${NYARELAY_VERSION:?set in deploy/docker/.env}"
    restart: unless-stopped
    environment:
      NYARELAY_LISTEN: ${NYARELAY_LISTEN:-:8080}
      NYARELAY_DATA: ${NYARELAY_DATA:-/data}
      NYARELAY_PUBLIC_URL: ${NYARELAY_PUBLIC_URL:?set in deploy/docker/.env}
      NYARELAY_METRICS_RETENTION: ${NYARELAY_METRICS_RETENTION:-168h}
      NYARELAY_AUDIT_RETENTION: ${NYARELAY_AUDIT_RETENTION:-2160h}
      NYARELAY_CLEANUP_INTERVAL: ${NYARELAY_CLEANUP_INTERVAL:-1h}
    volumes:
      - nyarelay-data:/data
    ports:
      - "${NYARELAY_BIND_ADDR:-127.0.0.1}:${NYARELAY_HOST_PORT:-8080}:8080"

volumes:
  nyarelay-data:
